# fly.toml - Fly.io configuration for citrus-ranking-bot
# Discord bot — no HTTP service needed, just a persistent worker

app = "citrus-ranking-bot"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"

# No [[services]] block — this is a background worker, not a web server

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
